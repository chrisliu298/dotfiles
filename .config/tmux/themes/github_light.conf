# GitHub Light
# Canvas is Ghostty's #fafafa. The status bar anchors one stop *below* it on #eaeef2
# (1.12:1) -- a footer, not a header -- with #d0d7de dividers and borders. Same treatment
# as the dark theme, which anchors on #010409. That #eaeef2 is also Claude Code's
# user-message band, one shared band surface in light mode; see agents/claude/README.md.
# Text: #1f2328 / #57606a / #6e7781, all 4.8:1+ on the bar.
# Accent: #ffb000, same amber as the dark theme.
# Amber only survives on a near-white surface as a FILL (8.6:1 with #1f2328 on it);
# as foreground on the bar it drops to 1.6:1 and turns to mush. So accent-bearing
# elements are amber fills here, and the two roles that can only be foreground -- the
# active pane border and the big clock -- use #a37100, the same hue one stop darker
# (4.1:1 on the canvas).

# status bar - anchored one stop below the canvas, like a window footer
set -g status-style "fg=#57606a,bg=#eaeef2"
set -g status-left-length 32
set -g status-right-length 80

# CPU/RAM threshold colors (tmux-cpu). Muted while idle so the readout stays
# ambient, warning yellow then red only when load actually matters.
set -g @cpu_low_fg_color "#[fg=#6e7781]"
set -g @cpu_medium_fg_color "#[fg=#bf8700]"
set -g @cpu_high_fg_color "#[fg=#cf222e]"
set -g @ram_low_fg_color "#[fg=#6e7781]"
set -g @ram_medium_fg_color "#[fg=#bf8700]"
set -g @ram_high_fg_color "#[fg=#cf222e]"

# left: session - amber pill, turns green on prefix
set -g status-left "#{?client_prefix,#[fg=#ffffff#,bg=#1a7f37#,bold],#[fg=#1f2328#,bg=#ffb000#,bold]} #S #[default] "

# right: cpu | ram | time | hostname
set -g status-right "#[fg=#8c959f]CPU #{cpu_fg_color}#{cpu_percentage}#[fg=#8c959f] RAM #{ram_fg_color}#{ram_percentage} #[fg=#d0d7de]│ #[fg=#6e7781]%I:%M %p #[fg=#d0d7de]│ #[fg=#57606a]#H "

# window tabs - inactive windows surface their flags (bell, activity, zoom),
# the active window only needs the zoom marker
setw -g window-status-format "#[fg=#6e7781] #I:#W#{?window_flags,#[fg=#bf8700]#{window_flags},} "
setw -g window-status-current-format "#[fg=#1f2328,bg=#ffb000,bold] #I:#W#{?window_zoomed_flag,#[fg=#1f2328#,bold] Z,} #[default]"
setw -g window-status-last-style "fg=#57606a"
setw -g window-status-activity-style "fg=#bf8700"
setw -g window-status-bell-style "fg=#cf222e,bold"
setw -g window-status-separator ""

# pane borders - foreground-only role, so it takes the darker stop
set -g pane-border-style "fg=#d0d7de"
set -g pane-active-border-style "fg=#a37100"

# messages - same surface as the bar they replace
set -g message-style "fg=#1f2328,bg=#eaeef2"
set -g message-command-style "fg=#1f2328,bg=#ffb000"

# copy mode - GitHub selection gold
setw -g mode-style "fg=#1f2328,bg=#fff4e0"

# clock - foreground-only role, so it takes the darker stop
setw -g clock-mode-colour "#a37100"
setw -g clock-mode-style 12
