# OpenAI Light — white canvas, light-gray status bar, green active state.

# status bar - anchored one stop below the canvas, like a window footer
set -g status-style "fg=#5c5c5c,bg=#f7f7f7"
set -g status-left-length 32
set -g status-right-length 80

# CPU/RAM threshold colors (tmux-cpu). Muted while idle so the readout stays
# ambient, warning yellow then red only when load actually matters.
set -g @cpu_low_fg_color "#[fg=#707070]"
set -g @cpu_medium_fg_color "#[fg=#956000]"
set -g @cpu_high_fg_color "#[fg=#bf1831]"
set -g @ram_low_fg_color "#[fg=#707070]"
set -g @ram_medium_fg_color "#[fg=#956000]"
set -g @ram_high_fg_color "#[fg=#bf1831]"

# left: lighter green fill with dark text; brighter green signals an active prefix
set -g status-left "#{?client_prefix,#[fg=#1f1f1f#,bg=#3bd5a4#,bold],#[fg=#1f1f1f#,bg=#00b889#,bold]} #S #[default] "

# right: cpu | ram | time | hostname
set -g status-right "#[fg=#707070]CPU #{cpu_fg_color}#{cpu_percentage}#[fg=#707070] RAM #{ram_fg_color}#{ram_percentage} #[fg=#d0d0d0]│ #[fg=#707070]%I:%M %p #[fg=#d0d0d0]│ #[fg=#5c5c5c]#H "

# window tabs - inactive windows surface their flags (bell, activity, zoom),
# the active window only needs the zoom marker
setw -g window-status-format "#[fg=#707070] #I:#W#{?window_flags,#[fg=#956000]#{window_flags},} "
setw -g window-status-current-format "#[fg=#1f1f1f,bg=#00b889,bold] #I:#W#{?window_zoomed_flag,#[fg=#1f1f1f#,bold] Z,} #[default]"
setw -g window-status-last-style "fg=#5c5c5c"
setw -g window-status-activity-style "fg=#956000"
setw -g window-status-bell-style "fg=#bf1831,bold"
setw -g window-status-separator ""

# pane borders
set -g pane-border-style "fg=#d0d0d0"
set -g pane-active-border-style "fg=#007a56"

# messages - same surface as the bar they replace
set -g message-style "fg=#1f1f1f,bg=#f7f7f7"
set -g message-command-style "fg=#007a56,bg=#f7f7f7"

# copy mode - neutral selection
setw -g mode-style "fg=#1f1f1f,bg=#e8e8e8"

# clock
setw -g clock-mode-colour "#007a56"
setw -g clock-mode-style 12
