# OpenAI Dark — black canvas, charcoal status bar, green active state.

# status bar - anchored one stop below the canvas, like a window footer
set -g status-style "fg=#9e9e9e,bg=#171717"
set -g status-left-length 32
set -g status-right-length 80

# left: green session pill; a lighter green signals an active prefix
set -g status-left "#{?client_prefix,#[fg=#000000#,bg=#3bd5a4#,bold],#[fg=#000000#,bg=#00b889#,bold]} #S #[default] "

# right: time | hostname
set -g status-right "#[fg=#9e9e9e]%I:%M %p #[fg=#3a3a3a]│ #[fg=#dcdcdc]#H "

# window tabs - inactive windows surface their flags (bell, activity, zoom),
# the active window only needs the zoom marker
setw -g window-status-format "#[fg=#9e9e9e] #I:#W#{?window_flags,#[fg=#f2be59]#{window_flags},} "
setw -g window-status-current-format "#[fg=#000000,bg=#00b889,bold] #I:#W#{?window_zoomed_flag,#[fg=#000000#,bold] Z,} #[default]"
setw -g window-status-last-style "fg=#dcdcdc"
setw -g window-status-activity-style "fg=#f2be59"
setw -g window-status-bell-style "fg=#ff7589,bold"
setw -g window-status-separator ""

# pane borders
set -g pane-border-style "fg=#262626"
set -g pane-active-border-style "fg=#00b889"

# messages - same surface as the bar they replace
set -g message-style "fg=#f2f2f2,bg=#171717"
set -g message-command-style "fg=#00b889,bg=#171717"

# copy mode - neutral selection
setw -g mode-style "fg=#f2f2f2,bg=#303030"

# clock
setw -g clock-mode-colour "#00b889"
setw -g clock-mode-style 12
