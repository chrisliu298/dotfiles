"$schema" = 'https://starship.rs/config-schema.json'

scan_timeout = 100

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$conda\
$docker_context\
$cmd_duration\
$time\
$line_break\
$character"""

palette = 'openai_dark'

[fill]
symbol = ' '

# --- Identity (present but quiet, like p10k's tan user@host) ---
[username]
show_always = true
style_user = "fg:oa_muted"
style_root = "fg:oa_red"
format = '[$user]($style)'

[hostname]
ssh_only = true
style = "fg:oa_muted"
format = '[@$hostname]($style)'

# --- Navigation (blue, matching directory names in terminal output) ---
[directory]
style = "fg:oa_blue"
format = ' [$path]($style)'
truncate_to_repo = false
truncation_length = 255

# --- Version control (green = clean, yellow = dirty) ---
[git_branch]
symbol = ""
style = "fg:oa_green"
format = '[ $symbol$branch]($style)'

[git_state]
style = "fg:oa_yellow"
format = '\([$state( $progress_current/$progress_total)]($style)\)'

[git_status]
style = "fg:oa_yellow"
format = '[ $all_status$ahead_behind]($style)'

# --- Language runtimes (muted cyan — visible but secondary) ---
[c]
symbol = ""
style = "fg:oa_cyan"
format = ' [$symbol $version]($style)'

[rust]
symbol = ""
style = "fg:oa_cyan"
format = ' [$symbol $version]($style)'

[golang]
symbol = ""
style = "fg:oa_cyan"
format = ' [$symbol $version]($style)'

[nodejs]
symbol = ""
style = "fg:oa_cyan"
format = ' [$symbol $version]($style)'

[php]
symbol = ""
style = "fg:oa_cyan"
format = ' [$symbol $version]($style)'

[java]
symbol = ""
style = "fg:oa_cyan"
format = ' [$symbol $version]($style)'

[kotlin]
symbol = ""
style = "fg:oa_cyan"
format = ' [$symbol $version]($style)'

[haskell]
symbol = ""
style = "fg:oa_cyan"
format = ' [$symbol $version]($style)'

[python]
symbol = ""
style = "fg:oa_cyan"
format = ' [$symbol $version(\($virtualenv\))]($style)'

# --- Infrastructure (purple — distinct from runtimes) ---
[conda]
symbol = ""
style = "fg:oa_purple"
format = ' [$symbol $environment]($style)'
ignore_base = false

[docker_context]
symbol = ""
style = "fg:oa_purple"
format = ' [$symbol $context]($style)'

# --- Meta (dimmed — shouldn't compete for attention) ---
[cmd_duration]
show_milliseconds = true
style = "fg:oa_dimmed"
format = ' [$duration]($style)'
disabled = false
show_notifications = true
min_time_to_notify = 45000

[time]
disabled = false
time_format = "%I:%M %p"
style = "fg:oa_dimmed"
format = ' [$time]($style)'

[line_break]
disabled = false

# --- Prompt character (green for success, red for error) ---
[character]
disabled = false
success_symbol = '[>](fg:oa_green)'
error_symbol = '[>](bold fg:oa_red)'
vimcmd_symbol = '[❮](fg:oa_green)'
vimcmd_replace_one_symbol = '[❮](fg:oa_purple)'
vimcmd_replace_symbol = '[❮](fg:oa_purple)'
vimcmd_visual_symbol = '[❮](fg:oa_yellow)'

# OpenAI Dark — neutral metadata with restrained semantic accents.
# Match Ghostty's OpenAI Dark ANSI colors.
[palettes.openai_dark]
oa_red = "#ff6177"       # root user, errors, prompt error
oa_green = "#00b889"     # git clean, prompt ok
oa_blue = "#5aaeff"      # directory path
oa_yellow = "#f2be59"    # git dirty/state, vim visual
oa_cyan = "#3fd1df"      # language runtimes — secondary info
oa_purple = "#b17aff"    # infrastructure, vim replace
oa_muted = "#9e9e9e"     # user@host — present but quiet
oa_dimmed = "#777777"    # time, cmd_duration — ambient

# OpenAI Light — the same semantic roles, tuned for the white canvas.
[palettes.openai_light]
oa_red = "#bf1831"       # root user, errors, prompt error
oa_green = "#007a56"     # git clean, prompt ok
oa_blue = "#005ed7"      # directory path
oa_yellow = "#956000"    # git dirty/state, vim visual
oa_cyan = "#007b87"      # language runtimes — secondary info
oa_purple = "#722ccc"    # infrastructure, vim replace
oa_muted = "#5c5c5c"     # user@host — present but quiet
oa_dimmed = "#707070"    # time, cmd_duration — ambient
