# The model and effort level of each resident Claude or agy session, by tmux session name
# (agy takes a base model id such as gemini-4-neon; `agy models` lists them with the level).
# tmux-persist launches a session on these on restore and restart (restart --effort
# still sets the level), and opus-repin switches a session back to this model after
# a safeguards refusal fallback and sets this level. The fallback model
# (claude-opus-5) keeps a session on it; "-" leaves the level as it is. Sessions not
# listed keep the model and level they run now. Edits apply at the next restart or
# repin; `tmux-persist restart <session>` applies them now.
# session               model             effort
autoeval-bot-r2v        claude-opus-5-5   medium
autoeval-compare-r2v    gemini-4-neon     high
autoeval-critic-r2v     claude-opus-5-5   high
autoeval-platform-r2v   claude-opus-5-5   medium
autoeval-rating-r2v     claude-opus-5-5   high
benchmark-r2v           claude-opus-5-5   high
bot-r2v                 claude-opus-5-5   medium
data-r2v                claude-opus-5-5   medium
eval-r2v                gemini-4-neon     high
ops-r2v                 claude-opus-5-5   medium
training-r2v            gemini-4-neon     high
workflow-r2v            claude-opus-5-5   medium
